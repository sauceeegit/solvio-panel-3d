<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Solvio Panel — Rooftop 3D</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  /* The 3D canvas fills the viewport ABOVE the bottom control section; JS keeps
     the bottom offset in sync with the actual bar height (it wraps on mobile). */
  #app { position: fixed; left: 0; right: 0; top: 0; bottom: 96px; }
  /* Half-transparent "drag" affordance over the model — fades out on first drag. */
  #draghint {
    position: absolute; left: 50%; bottom: 15%; transform: translateX(-50%);
    z-index: 6; pointer-events: none; user-select: none; white-space: nowrap;
    display: flex; align-items: center; gap: 8px;
    padding: 9px 16px; border-radius: 999px;
    background: rgba(20,22,24,.34); color: rgba(255,255,255,.92);
    font-size: 13px; font-weight: 600; letter-spacing: .3px;
    backdrop-filter: blur(4px);
    opacity: .78; transition: opacity .5s ease;
    animation: draghint-bob 2s ease-in-out infinite;
  }
  #draghint.hide { opacity: 0; }
  @keyframes draghint-bob { 0%,100% { transform: translate(-50%,0) } 50% { transform: translate(-50%,-5px) } }
  #hud {
    position: fixed; left: 16px; bottom: 14px; z-index: 10;
    color: #5b5b5b; font-size: 12px; line-height: 1.5; letter-spacing: .2px;
    background: rgba(255,255,255,.55); backdrop-filter: blur(6px);
    padding: 9px 12px; border-radius: 10px; border: 1px solid rgba(0,0,0,.06);
    user-select: none;
  }
  #hud b { color: #222; font-weight: 600; }
  #angle {
    position: fixed; left: 18px; top: 66px; z-index: 10; user-select: none;
    color: #5b5b5b; font-size: 12px; letter-spacing: .2px; font-variant-numeric: tabular-nums;
    background: rgba(255,255,255,.55); backdrop-filter: blur(6px);
    padding: 7px 11px; border-radius: 9px; border: 1px solid rgba(0,0,0,.06);
  }
  #angle b { color: #222; font-weight: 600; }
  #title {
    position: fixed; left: 18px; top: 16px; z-index: 10; user-select: none;
    color: #2b2b2b; font-weight: 600; font-size: 15px; letter-spacing: .3px;
  }
  #title span { display:block; color:#7a7a7a; font-weight:400; font-size:11px; margin-top:2px; }
  /* Auto-rotate / Frame / Labels stay functional for the postMessage API but are
     hidden from the UI (requested 2026-07-10). */
  #spin { display: none; }   /* Frame + Labels now live in the bottom bar (rooftop build) */
  /* ROOFTOP-ONLY BUILD: this page is locked to the rooftop scene, so the scene
     switcher, tilt/vertical, building and railing toggles are hidden. Only the
     panel-type (All-black / Classic) toggle stays in the bottom bar. */
  #bldgBtn, #sceneBtn, #modeBtn, #railBtn { display: none; }
  /* zoom in / out buttons floated over the model */
  #zoomCtrl {
    position: absolute; right: 14px; top: 14px; z-index: 8;
    display: flex; flex-direction: column; gap: 6px;
  }
  #zoomCtrl button {
    width: 34px; height: 34px; font-size: 19px; line-height: 1; color: #333; cursor: pointer;
    background: rgba(255,255,255,.88); border: 1px solid rgba(0,0,0,.14); border-radius: 8px;
    backdrop-filter: blur(6px);
  }
  #zoomCtrl button:active { background: #ececec; }
  #sceneBtn, #modeBtn, #typeBtn, #railBtn, #frameBtn, #labelBtn, #tiltBtn, #roofMatBtn {
    font-size: 14px; color:#444; background: #fff;
    border: 1px solid rgba(0,0,0,.14); border-radius: 9px; padding: 9px 15px; cursor: pointer;
    text-align: left; white-space: nowrap;
  }
  #modeBtn:disabled, #bldgBtn:disabled, #railBtn:disabled { opacity: .4; cursor: default; }
  .btn-on { background: #1a1a1a !important; color: #fff !important; border-color: #1a1a1a !important; }
  /* Bottom control section — a solid strip UNDER the 3D canvas (not an overlay). */
  #bctrl {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: flex-end; justify-content: center;
    user-select: none;
    background: #f4f5f7; border-top: 1px solid rgba(0,0,0,.09);
    padding: 12px 16px; font-size: 12px; color: #555;
  }
  #bctrl .ctrlgroup { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; }
  #bctrl #modeRow { align-items: center; gap: 8px; }
  #bctrl label { display: flex; flex-direction: column; gap: 4px; }
  #bctrl b { color: #222; font-weight: 600; font-variant-numeric: tabular-nums; }
  #bctrl input[type=range] { width: 160px; accent-color: #e8392b; }
  #bctrl .pcrow { display: flex; gap: 6px; align-items: center; height: 22px; }
  #bctrl .pcrow button {
    width: 26px; height: 22px; font-size: 15px; line-height: 1; color: #333;
    border: 1px solid rgba(0,0,0,.15); border-radius: 6px; background: rgba(255,255,255,.7); cursor: pointer;
  }
  #bctrl .pcrow button:disabled { opacity: .35; cursor: default; }
  /* the best-fit row holds text buttons, not the +/- steppers — let them size to fit */
  #bctrl #fitCtrl .pcrow { height: auto; flex-wrap: nowrap; }
  #bctrl #fitCtrl .pcrow button {
    width: auto; height: 26px; padding: 0 10px; font-size: 12px; white-space: nowrap;
  }
  /* Reserve a fixed slot for the "full" message so the +/- row never wraps to
     a second line when it appears. */
  #bctrl #pcMsg { color: #e8392b; font-size: 12px; white-space: nowrap; min-width: 30px; }
  /* Embedded in the product configurator (?embed=1): the parent's React
     configurator drives the scene (Location) and panel type (Module), so hide
     those toggles and the title/angle overlays. The bar stays visible with just
     Tilted, railing type, the dimension sliders and the panel count. */
  body.embed #title,
  body.embed #angle,
  body.embed #sceneBtn,
  body.embed #typeBtn { display: none !important; }
  /* Embedded on MOBILE: keep only the two dimension sliders on a single row —
     drop the tilt/railing buttons; the panel counter is floated into the model
     frame (see #app > #panelsCtrl + the JS that moves it). */
  @media (max-width: 1023px) {
    body.embed #modeRow { display: none !important; }
    body.embed #balconyCtrls,
    body.embed #gardenCtrls { flex-wrap: nowrap; gap: 12px; }
    body.embed #bctrl label { white-space: nowrap; }
    body.embed #bctrl input[type=range] { width: 104px; }
  }
  /* Panel counter floated into the bottom-right of the model frame (mobile
     embed). The JS moves #panelsCtrl into #app; these styles restyle it there
     since it leaves the #bctrl label / .pcrow scope. */
  #app > #panelsCtrl {
    position: absolute; right: 10px; bottom: 10px; z-index: 6; margin: 0;
    display: flex; flex-direction: row; align-items: center; gap: 8px;
    padding: 5px 7px 5px 12px; border-radius: 999px; white-space: nowrap;
    background: rgba(255,255,255,.86); backdrop-filter: blur(6px);
    box-shadow: 0 2px 12px rgba(0,0,0,.16);
    font-size: 12px; font-weight: 600; color: #333;
  }
  #app > #panelsCtrl b { color: #111; }
  #app > #panelsCtrl #pcMsg { display: none; }
  #app > #panelsCtrl .pcrow { display: flex; gap: 6px; align-items: center; }
  #app > #panelsCtrl .pcrow button {
    width: 28px; height: 28px; font-size: 17px; line-height: 1; color: #333;
    border: 1px solid rgba(0,0,0,.16); border-radius: 8px; background: #fff; cursor: pointer;
  }
  #app > #panelsCtrl .pcrow button:disabled { opacity: .35; cursor: default; }
</style>
</head>
<body>
<div id="app"><div id="draghint">✋ Drag with your finger</div>
  <div id="zoomCtrl"><button id="zoomIn" type="button" title="Zoom in">+</button><button id="zoomOut" type="button" title="Zoom out">−</button></div>
</div>
<div id="title">Solvio 3D model — Rooftop</div>
<div id="angle">—</div>
<button id="spin">▶ Auto-rotate</button>
<div id="bctrl">
  <span class="ctrlgroup" id="modeRow">
    <button id="sceneBtn">▤ Balcony</button>
    <button id="typeBtn">◧ All-black</button>
    <button id="tiltBtn">▭ Flat</button>
    <button id="roofMatBtn">▨ Concrete roof</button>
    <button id="frameBtn">☑ Frame</button>
    <button id="labelBtn">☑ Labels</button>
    <button id="modeBtn">◹ Tilted</button>
    <button id="bldgBtn">☑ Building</button>
    <button id="railBtn">▥ Bar railing</button>
  </span>
  <span class="ctrlgroup" id="balconyCtrls" style="display:none">
    <label>Balcony length &nbsp;<b><span id="lenOut">5.3</span> m</b>
      <input id="lenSlider" type="range" min="1.8" max="12" step="0.1" value="5.3" autocomplete="off" /></label>
    <label>Railing height &nbsp;<b><span id="depOut">0.95</span> m</b>
      <input id="depSlider" type="range" min="0.7" max="1.4" step="0.05" value="0.95" autocomplete="off" /></label>
  </span>
  <span class="ctrlgroup" id="gardenCtrls">
    <label><span id="gwLbl">Roof</span> width &nbsp;<b><span id="gwOut">11.3</span> m</b>
      <input id="gwSlider" type="range" min="2" max="20" step="0.1" value="11.3" autocomplete="off" /></label>
    <label id="glField"><span id="glLbl">Roof</span> length &nbsp;<b><span id="glOut">13.5</span> m</b>
      <input id="glSlider" type="range" min="2" max="20" step="0.1" value="13.5" autocomplete="off" /></label>
  </span>
  <label id="panelsCtrl">Panels &nbsp;<b><span id="pcOut">2</span></b>
    <span class="pcrow"><button id="pcMinus" type="button">−</button><button id="pcPlus" type="button">+</button><small id="pcMsg"></small></span></label>
  <label id="fitCtrl">Best fit &nbsp;<b><span id="fitOut">—</span></b>
    <span class="pcrow"><button id="orientBtn" type="button">▯ Portrait</button><button id="fitBtn" type="button">Fill roof</button></span></label>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';

// When embedded in the product page (?embed=1) the React configurator drives the
// model, so hide the in-model UI (see body.embed CSS) for a clean, full-frame
// canvas. Set before any layout is measured below.
const EMBEDDED = new URLSearchParams(location.search).get('embed') === '1';
if (EMBEDDED) document.body.classList.add('embed');
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

// ---- real-world dimensions (metres) ----
const W = 1.133;      // width
const H = 1.761;      // height
const D = 0.00475;    // thickness 4.75 mm — true to spec (frameless glass-glass laminate)
const R = 0.012;      // corner radius
const BORDER = 0.014; // black laminate border (no cells)

// ---- balcony dimensions (live-adjustable via sliders) ----
let balconyLen = 3 * H;    // handrail run along x (m)
let railingHeight = 0.95;  // floor-to-top-rail height (m); depth fixed at 1.2 m
let gardenWidth = 5, gardenLength = 5;   // garden plot (m): panels tile across width (x), wrap to rows in depth (z)
let roofWidth = 11.3, roofLength = 13.5; // rooftop bounding box (m) — the outline is scaled to fit
// Roof footprint as a closed polygon in normalised plan coordinates (0..1):
// u runs west->east, v runs south->north. A north-up image (Google Maps, most site
// plans) maps straight in — see solvioSetRoof().
// Default is the supplied triangular plan (north arrow up, so it maps in directly):
// a right angle at the west vertex, a 12 m edge running east at 20 deg south of
// horizontal, and a 10 m edge up to the north apex. Solving that gives corners
// (0,0), (11.276,-4.104) and (3.420,9.397) in metres, which normalise to the
// points below inside an 11.3 x 13.5 m bounding box.
let roofOutline = [
  [0, 0.304], [1, 0], [0.3033, 1]
];
const EDGE_CLEAR = 0.20;                 // clearance from panel to building edge (m)
// Obstructions: anything on the roof the array has to work around — stair cores, AC
// platforms, vents, water tanks. Each is a closed polygon in the SAME normalised plan
// coordinates as roofOutline, so they scale with the roof and can be traced off the
// same image. Panels keep the EDGE_CLEAR gap from them, just like the roof edge.
// Managed with solvioAddObstruction() / solvioSetObstructions() / solvioClearObstructions().
let roofObstructions = [];
const OBSTRUCTION_H = 1.5;               // height of the obstruction blocks (m)
let facadeWidth = 6;                     // facade wall width (m); wall height fixed at 3 m
const FIXED_RAILY = 0.945, FIXED_RAILZ = -0.367; // balcony stays here in both modes; panel+mount shift to hook onto it
let buildingVisible = true; // wall + floor slab (the "building"); toggled by the Building button
let panelType = 'black';    // 'black' (all-black mono) | 'classic' (blue cells, silver frame, gold badge)
let balconyType = 'baluster'; // 'baluster' (metal bars) | 'glass' (frameless glass panel, top rail only)
let panelCount = 2;           // rooftop build opens with a pair of panels side by side
const PANEL_GAP = 0.03;       // 3 cm horizontal gap (balcony row & garden columns)
const IN_ROW_GAP = 0.10;      // 10 cm between panels within a row (short edge to short edge)
const ROW_GAP    = 0.40;      // 40 cm between rows
const RAIL_EXT = 0.06;        // rails run past each panel end so they stay visible in that gap
let panelTilted = false;      // flat, or tilted up on two columns along one long edge
const TILT_DEG = 15;          // tilt angle when raised
let roofMaterial = 'concrete';   // 'concrete' | 'metal' — roof deck the panels sit on
// trapezoidal metal sheet, per the supplied profile: 700 mm cover = 2 x 350 mm ribs, 60 mm deep
const SHEET_PITCH = 0.35, SHEET_RIB_H = 0.06, SHEET_CROWN = 0.05, SHEET_SLOPE = 0.035;
const DECK_T = 0.10;          // overall deck build-up; its top sits at ROOF_HEIGHT
const CELL_PALETTES = {
  black:   { base: '#040405', cellA: '#0c0d12', cellB: '#090a0e',
             finger: 'rgba(40,44,55,0.28)', bus: 'rgba(70,76,90,0.30)', cham: 'rgba(0,0,0,0.55)',
             vignette: 'rgba(0,0,0,0.35)', badge: false },
  classic: { base: '#eceef2', cellA: '#111318', cellB: '#0a0b0f',
             finger: 'rgba(120,126,140,0.22)', bus: 'rgba(150,156,170,0.30)', cham: null,
             vignette: 'rgba(0,0,0,0.16)', badge: false }
};
let lastRailY = 0.945, lastRailZ = -0.37; // hook grab-line captured from the last assembly build

// ---- renderer ----
const app = document.getElementById('app');
// Keep the canvas area's bottom edge flush with the top of the control bar
// (the bar wraps to more rows on narrow screens).
const bctrlEl = document.getElementById('bctrl');
const syncBarOffset = () => { app.style.bottom = `${bctrlEl.offsetHeight}px`; };
syncBarOffset();
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(app.clientWidth, app.clientHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = false;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);


// On mobile embed, float the panel counter into the bottom-right of the model
// frame (out of the bottom bar) so the bar holds just the two dimension sliders.
if (EMBEDDED && matchMedia('(max-width: 1023px)').matches) {
  const pc = document.getElementById('panelsCtrl');
  if (pc) { app.appendChild(pc); syncBarOffset(); }
}

// Dismiss the "drag" hint on the first interaction (or after a few seconds).
(function () {
  const hint = document.getElementById('draghint');
  if (!hint) return;
  // Touch devices → "finger"; mouse (desktop) → "mouse".
  const touch = window.matchMedia('(pointer: coarse)').matches;
  hint.textContent = touch ? '✋ Drag with your finger' : '🖱 Drag with your mouse';
  const kill = () => {
    hint.classList.add('hide');
    setTimeout(() => hint.remove(), 600);
    app.removeEventListener('pointerdown', kill);
  };
  app.addEventListener('pointerdown', kill, { once: true });
  setTimeout(kill, 6000);
})();

// ---- scene ----
const scene = new THREE.Scene();

const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileCubemapShader();

// ---- camera ----
const camera = new THREE.PerspectiveCamera(38, app.clientWidth/app.clientHeight, 0.01, 100);
camera.position.set(3.4, 1.6, 4.0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 0.6;
controls.maxDistance = 60;   // rooftop scenes need more room than the balcony close-up
controls.target.set(0, 0.5, -0.05);

// ---- smooth, device-independent zoom ----
// three.js scales wheel zoom by |deltaY|, so a trackpad flick or hi-res mouse
// sends a huge delta and the view lurches. Disable the built-in zoom and drive
// it ourselves: clamp each wheel event to a small fixed step and ease the camera
// toward a target distance, so zoom stays gradual on any input device.
controls.enableZoom = false;
let zoomTarget = camera.position.distanceTo(controls.target);
let zooming = false;
const syncZoom = () => { zoomTarget = camera.position.distanceTo(controls.target); zooming = false; };
renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  const step = Math.max(-40, Math.min(40, e.deltaY)) * 0.0016;   // clamp magnitude → fixed-ish step
  zoomTarget = THREE.MathUtils.clamp(zoomTarget * Math.exp(step), controls.minDistance, controls.maxDistance);
  zooming = true;
}, { passive: false });

// ---- physically-based sky (Rayleigh + Mie scattering) ----
const sky = new Sky();
sky.scale.setScalar(10000);
scene.add(sky);
const skyU = sky.material.uniforms;
skyU['turbidity'].value    = 3;      // cleaner tropical sky
skyU['rayleigh'].value     = 1.0;    // vivid blue
skyU['mieCoefficient'].value     = 0.004;
skyU['mieDirectionalG'].value    = 0.85;
const SUN_DIR = new THREE.Vector3();
// Sun at ~38° elevation, 200° azimuth — matches key light angle
SUN_DIR.setFromSphericalCoords(1, THREE.MathUtils.degToRad(52), THREE.MathUtils.degToRad(200));
skyU['sunPosition'].value.copy(SUN_DIR);

// Generate env map FROM the sky so reflections match the background exactly
const skyScene = new THREE.Scene(); skyScene.add(sky);
scene.environment = pmrem.fromScene(skyScene, 0.04, 0.01, 2000).texture;
// The sky stays out of the visible scene — it is only used to bake the environment
// map (so glass still reflects a real sky). The backdrop is a flat dark orange.
sky.material.fog = false;
// Solvio brand orange (#ff6700, the accent used across solvio.solar), with a
// slightly deeper tone below so the backdrop still reads with some depth.
const BACKDROP_TOP = '#ff6700', BACKDROP_BOT = '#e05b00';
scene.background = makeGradient(BACKDROP_TOP, BACKDROP_BOT);
// haze pushed well beyond the building so it tints the horizon, not the model
scene.fog = new THREE.Fog(0xf26200, 45, 140);

// Sun directional light matching the sky's sun position
const sunLight = new THREE.DirectionalLight(0xfffae8, 2.8); // warm tropical sun
sunLight.position.set(SUN_DIR.x * 10, SUN_DIR.y * 10, SUN_DIR.z * 10);
sunLight.target.position.set(0, 0.3, 0);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.near = 0.5; sunLight.shadow.camera.far = 20;
sunLight.shadow.camera.left = -5; sunLight.shadow.camera.right = 5;
sunLight.shadow.camera.top = 5; sunLight.shadow.camera.bottom = -5;
sunLight.shadow.bias = -0.0003; sunLight.shadow.normalBias = 0.02;
scene.add(sunLight); scene.add(sunLight.target);
// Sky bounce: warm sky top, green-brown ground bounce
scene.add(new THREE.HemisphereLight(0x9ec8f0, 0x6b7c3e, 0.35));

// ---- ground shadow catcher ----
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(14, 14),
  new THREE.ShadowMaterial({ opacity: 0.30 })
);
ground.rotation.x = -Math.PI/2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);
// garden lawn (Garden mode) + building (Rooftop mode)
const gardenGroundMat = new THREE.MeshStandardMaterial({ color: 0xffffff, map: makeGrassMap(), roughness: 0.95, metalness: 0.0 });
const grassMat = new THREE.MeshStandardMaterial({ color: 0x4c7a30, roughness: 1.0, metalness: 0.0 }); // grass tufts
const ROOF_HEIGHT = 3;    // rooftop building height (m)
// Walls carry the same concrete finish as the roof deck, a shade darker. Its own
// texture instance, so the deck's size-driven repeat doesn't disturb the walls.
const wallConcreteMap = makeRoofConcreteMap();
wallConcreteMap.repeat.set(5, 2);
const wallMat = new THREE.MeshStandardMaterial({ color: 0xa2a2a2, map: wallConcreteMap, roughness: 0.95, metalness: 0.0 });
// roof obstructions — half transparent so the deck stays readable through them
const obstructionMat = new THREE.MeshStandardMaterial({
  color: 0x3a3d42, roughness: 0.55, metalness: 0.10,
  transparent: true, opacity: 0.5, side: THREE.DoubleSide, depthWrite: false
});
// concrete roof deck — procedural finish (aggregate, speckle, screed bay joints)
const concreteRoofMap = makeRoofConcreteMap();
const concreteMat  = new THREE.MeshStandardMaterial({ color: 0xffffff, map: concreteRoofMap, roughness: 0.95, metalness: 0.0 });
const metalRoofMat = new THREE.MeshStandardMaterial({ color: 0x9aa2aa, roughness: 0.34, metalness: 0.78 }); // trapezoidal metal sheet
const FACADE_WALL_H = 4.5;   // facade wall height (m)
const facadeWallMat = new THREE.MeshStandardMaterial({ color: 0x7ba0c4, roughness: 0.9, metalness: 0.0 }); // darker blue wall

// ---- the panel (built here, then mounted on the frame below) ----
// front glass with procedural cell texture
let cellTex = makeCellTexture(panelType);
cellTex.colorSpace = THREE.SRGBColorSpace;

const shape = roundedRectShape(W, H, R);
const geo = new THREE.ExtrudeGeometry(shape, { depth: D, bevelEnabled: false, curveSegments: 6 });
geo.translate(0, 0, -D/2);
// remap cap UVs (ExtrudeGeometry caps are in world XY) -> 0..1
cellTex.repeat.set(1/W, 1/H);
cellTex.offset.set(0.5, 0.5);

const glassMat = new THREE.MeshPhysicalMaterial({
  map: cellTex,
  color: 0xffffff,
  metalness: 0.0,
  roughness: 0.18,
  clearcoat: 1.0,
  clearcoatRoughness: 0.04,
  reflectivity: 0.5,
  specularIntensity: 0.9,
  envMapIntensity: 0.7,   // lower so cell texture isn't drowned by sky reflection
  // Iridescence = the blue-green AR coating shimmer real panels have
  iridescence: 0.6,
  iridescenceIOR: 1.5,
  iridescenceThicknessRange: [150, 400],
});
const edgeMat = new THREE.MeshStandardMaterial({ color: 0x141516, metalness: 0.85, roughness: 0.25, envMapIntensity: 1.1 }); // black anodized aluminum frame
// backsheet on the panel rear — white for the classic type, dark for the all-black type
const backMat = new THREE.MeshStandardMaterial({ color: 0x0e0e10, roughness: 0.72, metalness: 0.0, side: THREE.DoubleSide });
function setBacksheetColor() { backMat.color.set(panelType === 'classic' ? 0xeef0f3 : 0x0e0e10); }
setBacksheetColor();

// =================== shared frame materials + helpers (used by every build) ===================
const metal     = new THREE.MeshStandardMaterial({ color: 0x1a1c1e, metalness: 0.85, roughness: 0.30, envMapIntensity: 1.2 }); // matte black anodized
const metalDark = new THREE.MeshStandardMaterial({ color: 0x111214, metalness: 0.80, roughness: 0.40, envMapIntensity: 1.0 });

function makeBeam(p1, p2, bw, bh, mat) {            // rectangular box-section strut between two points
  const dir = new THREE.Vector3().subVectors(p2, p1);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.BoxGeometry(bw, len, bh), mat);
  m.castShadow = true; m.receiveShadow = true;
  m.position.copy(p1).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return m;
}
function flatBeam(p1, p2, faceDir, w, t, mat) {     // beam twisted so a flat face aligns with faceDir
  const dir = new THREE.Vector3().subVectors(p2, p1); const len = dir.length(); dir.normalize();
  const tAxis = faceDir.clone().normalize();
  const wAxis = new THREE.Vector3().crossVectors(dir, tAxis).normalize();
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, len, t), mat);
  m.castShadow = true; m.receiveShadow = true;
  m.position.copy(p1).addScaledVector(dir, len / 2);
  m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(wAxis, dir, tAxis));
  return m;
}
function footPad(p) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.012, 0.10), metalDark);
  m.castShadow = true; m.receiveShadow = true;
  m.position.set(p.x, 0.006, p.z);
  return m;
}
// flat bent-strap hook: bolted onto the vertical front rail, curling INWARD (toward -n / rear,
// where a balcony railing sits). Thickness Tb matches the frame bars; flat faces point sideways.
const HOOK_T = 0.04;                                // hook width across = vertical column width
const HOOK_R = 0.036, HOOK_CY = 0.030;              // U-bend radius + bend-start height (shared with the balcony rail)
const RAIL_Y = 0.945;                               // balcony handrail height — both mounts hook here
function makeHook(top) {
  const Wb = 0.005;                                 // strap width
  // Side-view candy-cane in the vertical/depth plane. a = rearward (away from the panel),
  // b = world-up. The straight slotted part runs down the VERTICAL column; the U curls over
  // the top toward the rear and opens straight down.
  const Rr = HOOK_R;                                // U-bend centerline radius (shared constant)
  const cy = HOOK_CY, tailY = -0.012, riserY = -0.16; // bend start height, tail bottom, riser bottom
  const arc = [150, 120, 90, 60, 30].map(deg => {   // clean 180° (half-circle) bend at radius Rr
    const t = deg * Math.PI / 180;
    return [Rr + Rr * Math.cos(t), cy + Rr * Math.sin(t)];
  });
  const key = [                                     // straight riser + the parametric half-circle bend
    [0, riserY], [0, -0.05], [0, 0.005], [0, cy],
    ...arc,
    [2 * Rr, cy], [2 * Rr, 0.008], [2 * Rr, tailY]
  ];
  const spline = new THREE.CatmullRomCurve3(key.map(p => new THREE.Vector3(p[0], p[1], 0)), false, 'catmullrom', 0.5);
  const cl = spline.getPoints(44).map(v => [v.x, v.y]);
  const left = [], right = [];
  for (let i = 0; i < cl.length; i++) {
    const p = cl[i];
    const a = cl[Math.max(0, i - 1)], b = cl[Math.min(cl.length - 1, i + 1)];
    let nx = -(b[1] - a[1]), ny = (b[0] - a[0]);
    const L = Math.hypot(nx, ny) || 1; nx /= L; ny /= L;
    left.push([p[0] + nx * Wb / 2, p[1] + ny * Wb / 2]);
    right.push([p[0] - nx * Wb / 2, p[1] - ny * Wb / 2]);
  }
  const shape = new THREE.Shape();
  shape.moveTo(left[0][0], left[0][1]);
  for (let i = 1; i < left.length; i++) shape.lineTo(left[i][0], left[i][1]);
  for (let i = right.length - 1; i >= 0; i--) shape.lineTo(right[i][0], right[i][1]);
  shape.closePath();
  const g = new THREE.ExtrudeGeometry(shape, { depth: HOOK_T, bevelEnabled: false, curveSegments: 3 });
  g.translate(0, 0, -HOOK_T / 2);
  const m = new THREE.Mesh(g, metal);
  m.castShadow = true; m.receiveShadow = true;
  // local X -> rearward (-z), local Y -> world up (+y), thickness (local Z) -> across (+x); broad face ±x
  m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(
    new THREE.Vector3(0, 0, -1), new THREE.Vector3(0, 1, 0), new THREE.Vector3(1, 0, 0)));
  m.position.copy(top);
  return m;
}

// numbered-label sprite (added per build)
function numberSprite(pos, text) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const c = cv.getContext('2d');
  c.fillStyle = '#e8392b'; c.beginPath(); c.arc(64, 64, 54, 0, Math.PI * 2); c.fill();
  c.lineWidth = 6; c.strokeStyle = '#fff'; c.stroke();
  c.fillStyle = '#fff'; c.font = 'bold 74px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(text, 64, 72);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, depthWrite: false, transparent: true }));
  sp.scale.set(0.085, 0.085, 0.085);
  sp.position.copy(pos);
  sp.renderOrder = 999;
  return sp;
}

// =================== building balcony the panel hooks onto ===================
// railY/railZ = world position of the hooks' U-bend centre (same for both legs).
// The handrail nestles up into the hook apex; balusters + slab + wall sit behind it.
function buildBalcony(parent, railY, railZ) {
  const g = new THREE.Group(); g.name = 'balcony'; g.visible = buildingVisible; parent.add(g);

  const L = balconyLen;                                // handrail run (live-adjustable length)
  const railR = 0.022;                                 // handrail tube radius (fits inside the hooks)
  const railCY = railY + (HOOK_R - 0.0025 - railR);    // top rail sits at the hook grab-line (fixed)
  const floorDepth = 1.2;                              // balcony depth, fixed at 1.2 m
  const floorY = railCY - railingHeight;               // drop the floor to set the railing height
  const lowY = floorY + 0.10;                          // lower rail just above the floor

  const rail     = new THREE.MeshStandardMaterial({ color: 0x4a5058, metalness: 0.75, roughness: 0.35, envMapIntensity: 1.0 }); // anthracite powder-coated steel
  const railD    = new THREE.MeshStandardMaterial({ color: 0x383d44, metalness: 0.70, roughness: 0.45 });
  const concrete = new THREE.MeshStandardMaterial({ color: 0xffffff, map: makeConcreteMap(), metalness: 0.0, roughness: 0.95 });
  const wallMat  = new THREE.MeshStandardMaterial({ color: 0xffffff, map: makeStuccoMap(), metalness: 0.0, roughness: 0.88 });
  const wallMatSolid = new THREE.MeshStandardMaterial({ color: 0xffffff, map: makeStuccoMap(), metalness: 0.0, roughness: 0.88 });

  const tube = (len, r, mat) => {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 20), mat);
    m.castShadow = true; m.receiveShadow = true; return m;
  };

  if (balconyType === 'glass') {
    // square-section top handrail sized to sit within the hook's U (hook inner opening ~67 mm)
    const sq = 0.032;
    const topBar = new THREE.Mesh(new THREE.BoxGeometry(L, sq, sq), rail);
    topBar.position.set(0, railCY, railZ); topBar.castShadow = topBar.receiveShadow = true; g.add(topBar);
    // frameless glass balustrade below the rail
    const glassBal = new THREE.MeshPhysicalMaterial({ color: 0xdfeaf0, metalness: 0.0, roughness: 0.06,
      transmission: 0.9, thickness: 0.012, ior: 1.5, transparent: true, envMapIntensity: 1.0 });
    const gTop = railCY - sq / 2, gBot = floorY, gH = Math.max(0.05, gTop - gBot); // glass spans slab top up to the square bar
    const glass = new THREE.Mesh(new THREE.BoxGeometry(L, gH, 0.012), glassBal);
    glass.position.set(0, (gTop + gBot) / 2, railZ); g.add(glass);
  } else {
    // round top handrail — the bar the hooks grab
    const top = tube(L, railR, rail); top.rotation.z = Math.PI / 2; top.position.set(0, railCY, railZ); g.add(top);
    // lower rail just above the floor
    const low = tube(L, railR * 0.8, rail); low.rotation.z = Math.PI / 2; low.position.set(0, lowY, railZ); g.add(low);
    // end posts (floor up to top rail)
    const postLen = (railCY + 0.04) - floorY;
    for (const px of [-L / 2, L / 2]) {
      const post = tube(postLen, 0.028, railD); post.position.set(px, (floorY + railCY + 0.04) / 2, railZ); g.add(post);
    }
    // balusters (lower rail up to top rail)
    const n = Math.max(2, Math.round(L / 0.11));
    for (let i = 0; i <= n; i++) {
      const b = tube(railCY - lowY, 0.006, rail);
      b.position.set(-L / 2 + i * (L / n), (railCY + lowY) / 2, railZ); g.add(b);
    }
  }
  // concrete floor slab + building wall (floor top at floorY)
  const groundGrp = new THREE.Group(); groundGrp.name = 'balconyGround'; g.add(groundGrp);
  const slabFront = railZ + 0.03;                      // floor reaches forward just up to the balcony railing
  const slabBack  = railZ - 0.02 - floorDepth;         // keep the original back edge (at the wall)
  const slabDepth = slabFront - slabBack;
  const slab = new THREE.Mesh(new THREE.BoxGeometry(L + 0.4, 0.2, slabDepth), wallMatSolid); // match the opaque lower wall
  slab.position.set(0, floorY - 0.1, (slabFront + slabBack) / 2);
  slab.receiveShadow = true; slab.castShadow = true; groundGrp.add(slab);
  const wallZ = railZ - floorDepth - 0.1;
  const wallTop = floorY + 1.6;                        // top lowered 1 m
  const wallBot = (floorY - 0.2) - 0.5;                // 0.5 m below the slab underside
  const slabTop = floorY;                              // split line = top of the base slab
  // upper section (above slab top): 50% transparent
  const upH = wallTop - slabTop;
  const wallUp = new THREE.Mesh(new THREE.BoxGeometry(L + 0.4, upH, 0.2), wallMat);
  wallUp.position.set(0, (wallTop + slabTop) / 2, wallZ); wallUp.receiveShadow = true; groundGrp.add(wallUp);
  // lower section (below slab top): opaque
  const loH = slabTop - wallBot;
  const wallLo = new THREE.Mesh(new THREE.BoxGeometry(L + 0.4, loH, 0.2), wallMatSolid);
  wallLo.position.set(0, (slabTop + wallBot) / 2, wallZ); wallLo.receiveShadow = true; groundGrp.add(wallLo);

  return g;
}

// =================== back-of-panel components: 3 junction boxes + 2 cables + 2 MC4 connectors ===================
// Built in the panel's local frame (x = width 1.133 m, y = height 1.761 m, z = thickness; front = +z).
function buildBackComponents() {
  const g = new THREE.Group(); g.name = 'backComponents';
  const boxMat  = new THREE.MeshStandardMaterial({ color: 0x1b1b1d, roughness: 0.60, metalness: 0.10 });
  const cableMat = new THREE.MeshStandardMaterial({ color: 0x0c0c0d, roughness: 0.75, metalness: 0.00 });
  const connMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2e, roughness: 0.45, metalness: 0.25 });
  const bz = -D / 2 - 0.008;                          // sit just off the back face, protruding away from the front
  const boxGeo = new THREE.BoxGeometry(0.10, 0.035, 0.016);   // "rectangular box" junction box
  const box = (x) => { const m = new THREE.Mesh(boxGeo, boxMat); m.position.set(x, 0, bz); m.castShadow = m.receiveShadow = true; return m; };
  const tube = (x1, x2, r, mat) => {                  // "circular tube" — x-aligned cylinder from x1 to x2
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, Math.abs(x2 - x1), 16), mat);
    m.rotation.z = Math.PI / 2; m.position.set((x1 + x2) / 2, 0, bz);
    m.castShadow = m.receiveShadow = true; return m;
  };
  g.add(box(-0.30), box(0), box(0.30));               // left, centre, right junction boxes
  g.add(tube(-0.35, -0.44, 0.005, cableMat), tube(-0.44, -0.48, 0.011, connMat));  // left  cable + connector (points left)
  g.add(tube( 0.35,  0.44, 0.005, cableMat), tube( 0.44,  0.48, 0.011, connMat));  // right cable + connector (points right)
  return g;
}

// =================== build ONE panel + mount unit (tilted / vertical / garden) ===================
// Rooftop build: lay the panel FLAT. The panel sits at 35° inside the unit, so
// rotating by (35° - 90°) leaves its face pointing straight up.
const GARDEN_ROT = THREE.MathUtils.degToRad(35) - Math.PI / 2;
function buildPanelUnit(mode) {
  const unit = new THREE.Group();
  const vertical = (mode === 'vertical');
  const garden = (mode === 'garden' || mode === 'rooftop');   // ground/roof stand: tilted A-frame sat on a surface

  const TILT = vertical ? 0 : THREE.MathUtils.degToRad(35);
  const u = new THREE.Vector3(0, Math.cos(TILT), -Math.sin(TILT));   // up the panel slope
  const n = new THREE.Vector3(0, Math.sin(TILT),  Math.cos(TILT));   // panel front normal
  const Ls = W, RAILX = 0.60, FFz = 0.34;
  const bo = n.clone().multiplyScalar(-(D / 2 + 0.0125));            // frame fronts just touch the panel back

  // panel: tilted (or upright) and turned landscape
  const mesh = new THREE.Mesh(geo, [glassMat, edgeMat]);
  mesh.castShadow = true; mesh.receiveShadow = true;
  const Cc = new THREE.Vector3(0, 0, FFz).add(u.clone().multiplyScalar(Ls / 2));
  if (vertical) Cc.y -= (Ls + HOOK_CY - RAIL_Y);    // drop the upright panel so its hooks hang on the handrail
  const tilt = new THREE.Group(); tilt.position.copy(Cc); tilt.rotation.x = -TILT; unit.add(tilt);
  const backsheet = new THREE.Mesh(new THREE.ShapeGeometry(roundedRectShape(W, H, R)), backMat);
  backsheet.position.z = -D / 2 - 0.001;             // solid backsheet just behind the rear face
  const land = new THREE.Group(); land.rotation.z = -Math.PI / 2; land.add(mesh); land.add(backsheet); land.add(buildBackComponents()); tilt.add(land);

  const frame = new THREE.Group(); frame.name = 'frameGrp'; unit.add(frame);
  const labelGroup = new THREE.Group(); labelGroup.name = 'labelGrp'; unit.add(labelGroup);
  let partNo = 0;
  let railY = 0, railZ = 0;                          // hook grab-line, captured below, used by the balcony
  const reg = (m, pos) => { frame.add(m); labelGroup.add(numberSprite(pos, String(++partNo))); return m; };

  const halfU = u.clone().multiplyScalar(Ls / 2);
  const Pb = Cc.clone().sub(halfU);                 // panel bottom
  const Pt = Cc.clone().add(halfU);                 // panel top

  for (const sx of [-RAILX, RAILX]) {
    if (vertical) {
      // upright panel: rail + column + hook all coincident on the back (allowed to overlap), no base bar
      const mountZ = Pt.z + bo.z;                                  // rail/column front touches panel back
      const Bb = new THREE.Vector3(sx, Pb.y, mountZ), Tt = new THREE.Vector3(sx, Pt.y, mountZ);
      const Cfoot = new THREE.Vector3(sx, Pb.y, mountZ), Ctop = new THREE.Vector3(sx, Pt.y, mountZ); // rails span the hanging panel
      reg(makeBeam(Bb, Tt, 0.042, 0.025, metal), Bb.clone().lerp(Tt, 0.5));         // panel-mount rail
      const col = makeBeam(Cfoot, Ctop, 0.025, 0.04, metal); col.rotateY(Math.PI / 2);
      reg(col, Cfoot.clone().lerp(Ctop, 0.5));                                       // column (overlaps the rail)
      reg(makeHook(Ctop), Ctop.clone().add(new THREE.Vector3(0, 0.10, -0.03)));      // hook (overlaps the column)
      railY = Ctop.y + HOOK_CY; railZ = Ctop.z - HOOK_R;
    } else {
      // tilted A-frame: rail (to ground) + column (to panel back) + base bar + hook
      const Bb = new THREE.Vector3(sx, Pb.y, Pb.z).add(bo);
      Bb.addScaledVector(u, (0 - Bb.y) / u.y);                     // stop rail's lower end at the ground
      const Tt = new THREE.Vector3(sx, Pt.y, Pt.z).add(bo);
      const colBack = 0.006;
      const colFrontZ = (Pt.z - colBack) + 0.0125;
      const PbackTop  = Pt.clone().addScaledVector(n, -D / 2);
      const Ctop = new THREE.Vector3(sx, PbackTop.y - n.z * (colFrontZ - PbackTop.z) / n.y, Pt.z - colBack);
      Tt.addScaledVector(u, (Ctop.y - Tt.y) / u.y);               // lower rail top to the column top
      const Cfoot = new THREE.Vector3(sx, -0.0125, Pt.z - colBack);
      const BarRear = new THREE.Vector3(sx, 0, colFrontZ);        // rear end butts flush against the column front face (no embedment)
      const Pback = Pb.clone().addScaledVector(n, -D / 2);
      const Ffoot = new THREE.Vector3(sx, 0, Pback.z - n.y * (0.0125 - Pback.y) / n.z);
      if (garden) {          // flat-lay: run the rail past both panel ends so it shows in the row gap
        Bb.addScaledVector(u, -RAIL_EXT);
        Tt.addScaledVector(u,  RAIL_EXT);
      }
      reg(makeBeam(Bb, Tt, 0.042, 0.025, metal), Bb.clone().lerp(Tt, 0.5));         // panel-mount rail (parts 1 & 4)
      if (!garden) {                     // rooftop/garden flat-lay keeps ONLY the two panel-mount rails
        const col = makeBeam(Cfoot, Ctop, 0.025, 0.04, metal); col.rotateY(Math.PI / 2);
        reg(col, Cfoot.clone().lerp(Ctop, 0.5));                                     // vertical column
        reg(makeBeam(BarRear, Ffoot, 0.040, 0.024, metalDark), BarRear.clone().lerp(Ffoot, 0.5)); // base bar 40 x 24mm
      }
      const hookTop = Ctop.clone(); hookTop.z -= (0.0125 + 0.0025);
      if (!garden) reg(makeHook(hookTop), hookTop.clone().add(new THREE.Vector3(0, 0.10, -0.03))); // hook (none in garden)
      railY = hookTop.y + HOOK_CY; railZ = hookTop.z - HOOK_R;
    }
  }

  if (!garden) {                     // flat-lay keeps only the two panel-mount rails
    for (const s of [0.30, 0.72]) {                                // horizontal cross-rails on the panel back
      const pL = new THREE.Vector3(-RAILX, Pb.y, Pb.z).lerp(new THREE.Vector3(-RAILX, Pt.y, Pt.z), s).add(bo);
      const pR = new THREE.Vector3( RAILX, Pb.y, Pb.z).lerp(new THREE.Vector3( RAILX, Pt.y, Pt.z), s).add(bo);
      reg(flatBeam(pL, pR, n, 0.03, 0.025, metal), pL.clone().lerp(pR, 0.5));
    }
    {                                                              // rear tie between the columns
      const tz = vertical ? (Pt.z + bo.z) : Pt.z;
      const rL = new THREE.Vector3(-RAILX, Pt.y / 4, tz), rR = new THREE.Vector3(RAILX, Pt.y / 4, tz);
      reg(makeBeam(rL, rR, 0.025, 0.025, metalDark), rL.clone().lerp(rR, 0.5));
    }
  }

  if (garden) {
    // sit on the ground on the opposite edge, but keep the panel facing the SAME way as the balcony (no flip)
    const qTilt = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), GARDEN_ROT);
    const qYaw  = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI);
    unit.quaternion.copy(qYaw.multiply(qTilt));   // tilt onto the opposite edge, then yaw 180° to face the viewer
    unit.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(unit);
    unit.position.y = -box.min.y;
  } else {
    // keep the balcony in a FIXED spot in both modes; shift the panel + mount so its hooks reach it
    const dy = FIXED_RAILY - railY, dz = FIXED_RAILZ - railZ;
    for (const grp of [tilt, frame, labelGroup]) { grp.position.y += dy; grp.position.z += dz; }
    lastRailY = FIXED_RAILY; lastRailZ = FIXED_RAILZ;
  }

  return unit;
}

// Flat-lay footprint of one panel: the laminate is turned landscape, so its LONG
// edge (H) runs along x and its SHORT edge (W) along z. Use the panel size itself
// rather than the unit's bounding box, so the extended rails don't inflate the pitch.
const GARDEN_SPAN_X = H;   // 1.761 m — long side, runs along x
const GARDEN_SPAN_Z = W;   // 1.133 m — short side, runs along z

// active plot size: garden, rooftop and facade keep their own width (and length where relevant)
function plotW() { return sceneMode === 'rooftop' ? roofWidth : sceneMode === 'facade' ? facadeWidth : gardenWidth; }
function plotL() { return sceneMode === 'rooftop' ? roofLength : gardenLength; }
// facade capacity: a single centred row of vertical (portrait) panels across the wall width
function facadePerRow() { return Math.max(1, Math.floor((facadeWidth + PANEL_GAP) / (W + PANEL_GAP))); }

// garden/roof grid capacity: panels per row across the width, and rows down the length
function gardenGrid() {
  const perRow = Math.max(1, Math.floor((plotW() + IN_ROW_GAP) / (GARDEN_SPAN_X + IN_ROW_GAP)));
  const rows   = Math.max(1, Math.floor((plotL() + ROW_GAP)    / (GARDEN_SPAN_Z + ROW_GAP)));
  return { perRow, rows };
}

// North marker lying on the roof deck, so the plan orientation (and therefore which
// way the panels face) is readable in the model.
function buildNorthMarker(pts) {
  const sz = 256;
  const cv = document.createElement('canvas'); cv.width = cv.height = sz;
  const c = cv.getContext('2d');
  c.clearRect(0, 0, sz, sz);
  c.fillStyle = '#33383d';
  c.beginPath(); c.moveTo(128, 24); c.lineTo(170, 120); c.lineTo(128, 100); c.lineTo(86, 120); c.closePath(); c.fill();
  c.font = 'bold 84px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('N', 128, 186);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 1.3),
    new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false }));
  m.name = 'northMarker';
  // Lying flat, the texture's "up" (the arrow tip) maps to -z, which is north here.
  // Do NOT add a z rotation — that turns the arrow around to face south.
  m.rotation.x = -Math.PI / 2;
  // Sit on the deck, stepped in from the northern-most corner toward the centroid —
  // that corner is the tip of the array, so it stays clear of the panels.
  let n = pts[0];
  for (const p of pts) if (p.z < n.z) n = p;
  const cx = pts.reduce((s, p) => s + p.x, 0) / pts.length;
  const cz = pts.reduce((s, p) => s + p.z, 0) / pts.length;
  const dx = cx - n.x, dz = cz - n.z, d = Math.hypot(dx, dz) || 1;
  const inset = Math.min(1.5, d * 0.6);
  m.position.set(n.x + dx / d * inset, ROOF_HEIGHT + 0.02, n.z + dz / d * inset);
  return m;
}

// =================== roof footprint (arbitrary polygon) ===================
// The normalised outline is scaled into the roofWidth x roofLength box and centred.
// Plan v maps to -z, so the north arrow on the plan points to -z in the model; the
// panels are raised on their -z edge, which therefore makes them face south.
function outlineWorld(w, l) {
  return roofOutline.map(([u, v]) => ({ x: (u - 0.5) * w, z: (0.5 - v) * l }));
}
// same mapping for every obstruction polygon
function obstructionsWorld(w, l) {
  return roofObstructions
    .filter(poly => poly.length >= 3)
    .map(poly => poly.map(([u, v]) => ({ x: (u - 0.5) * w, z: (0.5 - v) * l })));
}
// Shape for extrusion: built as (x, -z) so a -90 deg X rotation stands it up with z intact.
function polyShape(pts) {

    const cx = (fb.min.x + fb.max.x) / 2, cz = (fb.min.z + fb.max.z) / 2;
    {
      // lawn sized to the garden plot, centred on the array
      const gg = new THREE.Mesh(new THREE.PlaneGeometry(plotW(), plotL()), gardenGroundMat);
      gg.rotation.x = -Math.PI / 2; gg.receiveShadow = true; gg.name = 'gardenGround';
      gg.position.set(cx, 0, cz);
      assembly.add(gg);
      const grass = buildGrassEdges(plotW(), plotL());   // small grass tufts along the lawn edges
      grass.position.set(cx, 0, cz); assembly.add(grass);
    }
  } else {
    const pitch = H + PANEL_GAP, total = N * H + (N - 1) * PANEL_GAP, x0 = -total / 2 + H / 2;
    for (let i = 0; i < N; i++) {
      const u = (i === 0) ? base : base.clone(true);
      u.position.x = x0 + i * pitch;                 // centred row along the balcony (x)
      assembly.add(u);
    }
    buildBalcony(assembly, FIXED_RAILY, FIXED_RAILZ);
  }
  return { assembly };
}

// distance needed to keep the whole array in frame
function fitDistance() {
  if (sceneMode === 'balcony') {
    const span = panelCount * H + (panelCount - 1) * PANEL_GAP;   // panel row width along the balcony
    return Math.max(5.6, 2.4 + span);

function dollyToFit() {
  const off = camera.position.clone().sub(controls.target), need = fitDistance();
  if (off.length() < need) { off.setLength(need); camera.position.copy(controls.target).add(off); controls.update(); }
  syncZoom();
}

  // use the plan diagonal, so a long or wide roof still frames fully

// ---- roof outline API ----------------------------------------------------
// Drive the roof from a traced plan / satellite view. Pass the outline as an array
// of [u, v] points in 0..1, going round the roof in order, where u runs west->east
// and v runs south->north (v = 1 is whichever way the plan's north arrow points).
// Pixel coordinates off an image work directly — pass imageHeight and they are
// normalised and v-flipped for you. Optionally give the real-world size in metres.
//   solvioSetRoof({ outline: [[0,0],[1,0],[1,.5],[.6,.5],[.6,1],[0,1]] })
//   solvioSetRoof({ outline: [[12,340],[430,340],...], imageWidth: 432, imageHeight: 383,
//                   width: 18, length: 16 })
window.solvioSetRoof = (opts = {}) => {
  const { outline, imageWidth, imageHeight, width, length } = opts;
  if (Array.isArray(outline) && outline.length >= 3) {
    roofOutline = imageWidth && imageHeight
      ? outline.map(([px, py]) => [px / imageWidth, 1 - py / imageHeight])   // image y grows downward
      : outline.map(([u, v]) => [u, v]);
  }
  if (typeof width  === 'number' && width  > 0) { roofWidth  = width;  gwSlider.value = width;  gwOut.textContent = width.toFixed(1); }
  if (typeof length === 'number' && length > 0) { roofLength = length; glSlider.value = length; glOut.textContent = length.toFixed(1); }
  if (panelCount > maxPanels()) panelCount = maxPanels();
  rebuildAll(); updatePcUI(); frameScene();
  return { outline: roofOutline, width: roofWidth, length: roofLength, slots: maxPanels() };
};

// ---- roof obstruction API --------------------------------------------------
// Mark areas the array must avoid. Accepts the same coordinate forms as the roof
// outline, plus a plain rectangle in metres measured from the roof centre:
//   solvioAddObstruction([[u,v], ...])                                  normalised 0..1
//   solvioAddObstruction([[px,py], ...], { imageWidth, imageHeight })   traced pixels
//   solvioAddObstruction({ centre: [x, z], size: [w, l] })              metres, x east / z south
// Panels keep the same 200 mm clearance from these as from the roof edge.
function obstructionToPlan(spec, opts = {}) {
  if (spec && !Array.isArray(spec) && spec.centre && spec.size) {
    const [cx, cz] = spec.centre, [sw, sl] = spec.size;
    const toUV = (x, z) => [x / roofWidth + 0.5, 0.5 - z / roofLength];
    return [toUV(cx - sw / 2, cz - sl / 2), toUV(cx + sw / 2, cz - sl / 2),
            toUV(cx + sw / 2, cz + sl / 2), toUV(cx - sw / 2, cz + sl / 2)];
  }
  if (!Array.isArray(spec) || spec.length < 3) return null;
  const { imageWidth, imageHeight } = opts;
  return imageWidth && imageHeight
    ? spec.map(([px, py]) => [px / imageWidth, 1 - py / imageHeight])
    : spec.map(([u, v]) => [u, v]);
}
function refreshAfterRoofChange() {
  if (panelCount > maxPanels()) panelCount = maxPanels();
  rebuildAll(); updatePcUI();
}
window.solvioAddObstruction = (spec, opts) => {
  const poly = obstructionToPlan(spec, opts);
  if (poly) roofObstructions.push(poly);
  refreshAfterRoofChange();
  return { obstructions: roofObstructions.length, slots: maxPanels() };
};
window.solvioSetObstructions = (list = [], opts) => {
  roofObstructions = list.map(s => obstructionToPlan(s, opts)).filter(Boolean);
  refreshAfterRoofChange();
  return { obstructions: roofObstructions.length, slots: maxPanels() };
};
window.solvioClearObstructions = () => {
  roofObstructions = [];
  refreshAfterRoofChange();
  return { obstructions: 0, slots: maxPanels() };
};

  snap.environment = scene.environment;
  snap.add(grp);
  const k = new THREE.DirectionalLight(0xffffff, 2.4); k.position.set(-1.5, 2.2, -3.2); snap.add(k);
  snap.add(new THREE.AmbientLight(0xffffff, 0.5));
  const cam = new THREE.PerspectiveCamera(32, outW / outH, 0.01, 100);
  const off = new THREE.Vector3().setFromSpherical(
    new THREE.Spherical(dist, THREE.MathUtils.degToRad(90 - elDeg), THREE.MathUtils.degToRad(azDeg)));
  cam.position.copy(off); cam.lookAt(0, 0, 0);
  const prevSize = new THREE.Vector2(); renderer.getSize(prevSize); const pr = renderer.getPixelRatio();
  renderer.setPixelRatio(1); renderer.setSize(outW, outH, false);
  renderer.render(snap, cam);
  const url = renderer.domElement.toDataURL('image/jpeg', 0.88);
  const w = prevSize.x || app.clientWidth, h = prevSize.y || app.clientHeight;
  renderer.setPixelRatio(pr); renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  return url;
};

window.__render = () => renderer.render(scene, camera);   // force a redraw (for off-screen capture)

// ---- loop ----
function animate() {
  requestAnimationFrame(animate);
  if (spinning) current.assembly.rotation.y += 0.0035;
  controls.update();
  if (zooming) {
    const off = camera.position.clone().sub(controls.target);
    const cur = off.length();
    const diff = zoomTarget - cur;
    if (Math.abs(diff) < 0.003) { off.setLength(zoomTarget); zooming = false; }
    else off.setLength(cur + diff * 0.18);
    camera.position.copy(controls.target).add(off);
  }
  updateAngle();
  renderer.render(scene, camera);
}
animate();

const onResize = () => {
  syncBarOffset();
  camera.aspect = app.clientWidth/app.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(app.clientWidth, app.clientHeight);
};
addEventListener('resize', onResize);
// The bar height also changes when its contents wrap (e.g. scene switch swaps
// slider groups) without a window resize — watch it directly.
new ResizeObserver(onResize).observe(bctrlEl);

// =================== helpers ===================
function roundedRectShape(w, h, r) {
  const s = new THREE.Shape();
  const x = -w/2, y = -h/2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h);
  s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

function makeGradient(top, bottom, stops) {
  const c = document.createElement('canvas');
  c.width = 4; c.height = 512;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 512);
  if (stops) { stops.forEach(([pos, col]) => grad.addColorStop(pos, col)); }
  else { grad.addColorStop(0, top); grad.addColorStop(1, bottom); }
  g.fillStyle = grad; g.fillRect(0, 0, 4, 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function makeOutdoorEnvMap() {
  // Equirectangular (2:1) outdoor sky texture for PMREM
  const w = 1024, h = 512;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  // Sky top → horizon → ground
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0,    '#2b6ea6');
  grad.addColorStop(0.38, '#6aade0');
  grad.addColorStop(0.50, '#c2daf0');
  grad.addColorStop(0.52, '#8aaa65');
  grad.addColorStop(0.75, '#6b8a4e');
  grad.addColorStop(1,    '#4a6035');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
  // Sun glow (upper quarter, left of center)
  const sx = w * 0.28, sy = h * 0.30;
  const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, 80);
  sg.addColorStop(0,   'rgba(255,252,220,1)');
  sg.addColorStop(0.15,'rgba(255,240,180,0.85)');
  sg.addColorStop(0.45,'rgba(255,220,140,0.30)');
  sg.addColorStop(1,   'rgba(255,200,100,0)');
  ctx.fillStyle = sg; ctx.fillRect(0, 0, w, h);
  // Horizon brightness band
  const hg = ctx.createLinearGradient(0, h * 0.44, 0, h * 0.56);
  hg.addColorStop(0, 'rgba(255,255,255,0)');
  hg.addColorStop(0.5,'rgba(220,235,248,0.55)');
  hg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hg; ctx.fillRect(0, 0, w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.mapping = THREE.EquirectangularReflectionMapping;
  return t;
}

function makeGrassMap() {
  const sz = 512;
  const cv = document.createElement('canvas'); cv.width = cv.height = sz;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#5a7c3c'; ctx.fillRect(0, 0, sz, sz);
  // large tonal patches — real lawns have colour variation
  for (let i = 0; i < 900; i++) {
    const x = Math.random() * sz, y = Math.random() * sz;
    const r = Math.random() * 28 + 5;
    ctx.fillStyle = Math.random() > 0.5 ? `rgba(100,150,45,${0.25+Math.random()*0.30})` : `rgba(28,55,12,${0.18+Math.random()*0.25})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  // fine blade streaks
  ctx.strokeStyle = 'rgba(55,90,25,0.25)'; ctx.lineWidth = 1;
  for (let i = 0; i < 500; i++) {
    const x = Math.random() * sz, y = Math.random() * sz;
    const len = Math.random() * 18 + 3;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + (Math.random()-0.5)*5, y - len); ctx.stroke();
  }
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(8, 8);
  return t;
}

function makeBrickMap() {
  const sz = 512, bCols = 5, bRows = 9;
  const cv = document.createElement('canvas'); cv.width = sz; cv.height = sz;
  const ctx = cv.getContext('2d');
  // mortar background
  ctx.fillStyle = '#b2a898'; ctx.fillRect(0, 0, sz, sz);
  const bW = sz / bCols, bH = sz / bRows;
  const mH = bH * 0.10, mV = bW * 0.055;
  for (let r = 0; r < bRows; r++) {
    const ox = (r % 2) * bW * 0.5;
    for (let c = -1; c < bCols + 1; c++) {
      const x = c * bW + ox + mV * 0.5;
      const y = r * bH + mH * 0.5;
      const w = bW - mV, h = bH - mH;
      // per-brick color variation using deterministic noise
      const v = (Math.sin(r * 5.1 + c * 8.7) * 0.5 + Math.sin(r * 2.3 + c * 3.1) * 0.25 + 0.5);
      const dr = Math.floor(v * 28) - 14;
      ctx.fillStyle = `rgb(${158+dr},${59+Math.floor(dr*0.5)},${49+Math.floor(dr*0.4)})`;
      ctx.fillRect(Math.max(0, x), y, Math.min(w, sz - Math.max(0, x)), h);
      // subtle top-edge highlight (like ambient occlusion on mortar shadow)
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      ctx.fillRect(Math.max(0, x), y, Math.min(w, sz - Math.max(0, x)), h * 0.18);
      // fine surface grain
      for (let i = 0; i < 18; i++) {
        ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.06})`;
        ctx.fillRect(Math.max(0, x) + Math.random() * w, y + Math.random() * h, Math.random() * 4 + 1, Math.random() * 3 + 1);
      }
    }
  }
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(5, 6);
  return t;
}

function makeConcreteMap(light = false) {
  const sz = 512;
  const cv = document.createElement('canvas'); cv.width = cv.height = sz;
  const ctx = cv.getContext('2d');
  const base = light ? '#c8c2b5' : '#c0bab0';
  ctx.fillStyle = base; ctx.fillRect(0, 0, sz, sz);
  // large coarse aggregate variation
  for (let i = 0; i < 220; i++) {
    const x = Math.random() * sz, y = Math.random() * sz;
    const r = Math.random() * 7 + 2;
    const v = Math.random();
    ctx.fillStyle = v > 0.6 ? `rgba(255,255,240,${0.10+Math.random()*0.15})` : `rgba(0,0,0,${0.08+Math.random()*0.14})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  // fine grain speckle
  for (let i = 0; i < 4000; i++) {
    const x = Math.random() * sz, y = Math.random() * sz;
    ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.10)' : 'rgba(0,0,0,0.11)';
    ctx.fillRect(x, y, Math.random() * 2 + 0.5, Math.random() * 2 + 0.5);
  }
  // visible expansion/form-tie joints
  ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 2;
  for (let i = 1; i < 4; i++) {
    const p = i / 4 * sz;
    ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, sz); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(sz, p); ctx.stroke();
  }
  // slightly lighter highlight along joint edges
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const p = i / 4 * sz + 2;
    ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, sz); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(sz, p); ctx.stroke();
  }
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(4, 3);
  return t;
}

// Concrete finish for the roof deck: broad tonal mottling + fine aggregate grain,
// with a screed bay joint around each tile (one bay per texture repeat).
function makeRoofConcreteMap() {
  const sz = 512;
  const cv = document.createElement('canvas'); cv.width = cv.height = sz;
  const c = cv.getContext('2d');
  c.fillStyle = '#bcb8b1'; c.fillRect(0, 0, sz, sz);
  for (let i = 0; i < 26; i++) {                       // soft patches — poured/trowelled variation
    const x = Math.random() * sz, y = Math.random() * sz, r = 40 + Math.random() * 90;
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, Math.random() > 0.5 ? 'rgba(120,116,110,0.15)' : 'rgba(255,253,246,0.15)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
  }
  for (let i = 0; i < 9000; i++) {                     // fine grain
    const x = Math.random() * sz, y = Math.random() * sz, s = Math.random() * 1.6 + 0.4;
    c.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.13)' : 'rgba(60,58,55,0.13)';
    c.fillRect(x, y, s, s);
  }
  for (let i = 0; i < 260; i++) {                      // scattered aggregate specks
    const x = Math.random() * sz, y = Math.random() * sz, r = Math.random() * 1.8 + 0.6;
    c.fillStyle = 'rgba(90,88,84,0.22)';
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
  }
  c.strokeStyle = 'rgba(80,78,74,0.50)'; c.lineWidth = 3;   // bay joint at the tile edge
  c.strokeRect(1.5, 1.5, sz - 3, sz - 3);
  c.strokeStyle = 'rgba(255,255,255,0.16)'; c.lineWidth = 1.5;
  c.strokeRect(4, 4, sz - 8, sz - 8);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

function makeStuccoMap() {
  const sz = 512;
  const cv = document.createElement('canvas'); cv.width = cv.height = sz;
  const ctx = cv.getContext('2d');
  // warm cream/sand plaster — typical Mediterranean exterior wall
  ctx.fillStyle = '#e8e0d0'; ctx.fillRect(0, 0, sz, sz); // warm cream — like the building in image 2
  // very fine plaster grain — tiny specks only, no big blobs
  for (let i = 0; i < 8000; i++) {
    const x = Math.random() * sz, y = Math.random() * sz;
    const r = Math.random() * 1.6 + 0.3;
    ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,248,228,0.12)' : 'rgba(100,85,55,0.09)';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  // small pebble inclusions — subtle, max 4px
  for (let i = 0; i < 250; i++) {
    const x = Math.random() * sz, y = Math.random() * sz;
    const r = Math.random() * 3 + 0.8;
    ctx.fillStyle = Math.random() > 0.5 ? `rgba(210,195,160,${0.10+Math.random()*0.12})` : `rgba(80,65,40,${0.07+Math.random()*0.10})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(4, 3);
  return t;
}

// panel face texture: 6 columns x 16 rows of half-cut cells, multi-busbar fingers, central ribbon gap.
// type 'black' = all-black mono-PERC; type 'classic' = blue cells + silver grid/frame + gold Solvio badge.
function makeCellTexture(type = 'black') {
  const P = CELL_PALETTES[type] || CELL_PALETTES.black;
  const cols = 6, rows = 16;
  const px = 1400;                                   // canvas width
  const py = Math.round(px * H / W);                 // keep face aspect
  const cv = document.createElement('canvas');
  cv.width = px; cv.height = py;
  const ctx = cv.getContext('2d');

  // base laminate (black, or silver-white for classic — shows as the grid + frame)
  ctx.fillStyle = P.base;
  ctx.fillRect(0, 0, px, py);

  // active (celled) area inside the border
  const bx = BORDER / W * px, by = BORDER / H * py;
  const aw = px - 2*bx, ah = py - 2*by;

  const gap = aw * 0.0042;          // gap between cells
  const midGap = ah * 0.012;        // larger central ribbon gap (half-cut split)
  const cw = (aw - (cols - 1) * gap) / cols;
  const ch = (ah - (rows - 1) * gap - midGap) / rows;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = bx + c * (cw + gap);
      let y = by + r * (ch + gap);
      if (r >= rows / 2) y += midGap;               // central split

      // cell body — gradient sheen
      const grad = ctx.createLinearGradient(x, y, x + cw, y + ch);
      grad.addColorStop(0, P.cellA);
      grad.addColorStop(0.5, P.cellB);
      grad.addColorStop(1, P.cellA);
      ctx.fillStyle = grad;
      roundRect(ctx, x, y, cw, ch, cw * 0.03);
      ctx.fill();

      // multi-busbar fingers — fine vertical lines
      ctx.strokeStyle = P.finger;
      ctx.lineWidth = Math.max(1, px * 0.0006);
      const fingers = 12;
      for (let f = 1; f < fingers; f++) {
        const fx = x + (cw * f / fingers);
        ctx.beginPath(); ctx.moveTo(fx, y + ch*0.04); ctx.lineTo(fx, y + ch*0.96); ctx.stroke();
      }

      // two horizontal busbar wires with solder dots
      ctx.strokeStyle = P.bus;
      ctx.lineWidth = Math.max(1, px * 0.0009);
      for (const bb of [0.33, 0.67]) {
        const yb = y + ch * bb;
        ctx.beginPath(); ctx.moveTo(x + cw*0.03, yb); ctx.lineTo(x + cw*0.97, yb); ctx.stroke();
      }

      // corner chamfer marks (mono cell pseudo-square corners) — skipped when palette cham is null
      if (P.cham) {
        ctx.strokeStyle = P.cham;
        ctx.lineWidth = Math.max(1, px * 0.0016);
        const chm = cw * 0.10;
        ctx.beginPath();
        ctx.moveTo(x, y + chm); ctx.lineTo(x + chm, y);
        ctx.moveTo(x + cw - chm, y); ctx.lineTo(x + cw, y + chm);
        ctx.moveTo(x, y + ch - chm); ctx.lineTo(x + chm, y + ch);
        ctx.moveTo(x + cw - chm, y + ch); ctx.lineTo(x + cw, y + ch - chm);
        ctx.stroke();
      }
    }
  }

  // faint overall vignette toward edges
  const vg = ctx.createRadialGradient(px/2, py/2, py*0.2, px/2, py/2, py*0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, P.vignette);
  ctx.fillStyle = vg; ctx.fillRect(0, 0, px, py);

  // gold "Solvio" badge (classic type), bottom-right of the portrait face
  if (P.badge) {
    const bxp = px * 0.70, byp = py * 0.80, br = px * 0.078;
    const gg = ctx.createRadialGradient(bxp - br*0.35, byp - br*0.35, br*0.1, bxp, byp, br);
    gg.addColorStop(0, '#f4dc94'); gg.addColorStop(0.55, '#dbb659'); gg.addColorStop(1, '#a67f2e');
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(bxp, byp, br, 0, Math.PI*2); ctx.fill();
    ctx.lineWidth = px * 0.004; ctx.strokeStyle = '#c9a24a'; ctx.stroke();
    ctx.fillStyle = '#c14425';
    ctx.font = `600 ${Math.round(br*0.52)}px -apple-system, Segoe UI, Roboto, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Solvio', bxp, byp);
  }

  const t = new THREE.CanvasTexture(cv);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
